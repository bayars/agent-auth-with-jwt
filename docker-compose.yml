services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/poc-realm HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.0 200' <&3"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 40s
    networks:
      - poc-net

  fastmcp:
    build: ./fastmcp-server
    ports:
      - "8000:8000"
    environment:
      KC_REALM_URL: http://keycloak:8080/realms/poc-realm
      # KC_ISSUER must match the `iss` claim in tokens (external-facing URL).
      # Browser tokens have iss=http://localhost:8080/... because Keycloak's
      # start-dev mode uses the incoming request host as the issuer.
      KC_ISSUER: http://localhost:8080/realms/poc-realm
      FASTMCP_BASE_URL: http://fastmcp:8000
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - poc-net

  # ── Example MCP tool servers ──────────────────────────────────────────────
  mcp-http-caller:
    build: ./tools/http-caller
    ports:
      - "8001:8000"
    environment:
      PORT: "8000"
      ALLOWED_DOMAINS: ""           # empty = allow all domains
      DEFAULT_TIMEOUT_SECONDS: "30"
      MAX_RESPONSE_BYTES: "50000"
    networks:
      - poc-net

  mcp-file-generator:
    build: ./tools/file-generator
    ports:
      - "8002:8000"
    environment:
      PORT: "8000"
    networks:
      - poc-net

  mcp-text-generator:
    build: ./tools/text-generator
    ports:
      - "8003:8000"
    environment:
      PORT: "8000"
    networks:
      - poc-net

  mcp-text-utils:
    build: ./tools/text-utils
    ports:
      - "8004:8000"
    environment:
      PORT: "8000"
    networks:
      - poc-net

  mcp-rag-server:
    build: ./tools/rag-server
    ports:
      - "8005:8000"
    environment:
      PORT: "8000"
      EMBEDDING_PROVIDER: "ollama"
      OLLAMA_URL: "http://10.0.0.224:11434"
      OLLAMA_EMBED_MODEL: "qwen2.5:1.5b"
      CHROMA_PERSIST_PATH: ""           # empty = in-memory (set a path for persistence)
      # Auth (optional) — uncomment to require JWT:
      # KC_REALM_URL: "http://keycloak:8080/realms/poc-realm"
      # KC_ISSUER: "http://localhost:8080/realms/poc-realm"
      # FASTMCP_BASE_URL: "http://mcp-rag-server:8000"
    networks:
      - poc-net

  opencode:
    image: node:22-alpine
    command: sh -c "npx --yes opencode-ai@latest"
    working_dir: /workspace
    volumes:
      - ./nextjs-app/opencode.json:/workspace/opencode.json:ro
      - ./nextjs-app/skills:/workspace/skills:ro
    environment:
      # ANTHROPIC_API_KEY is optional — we use Ollama instead
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-needed}
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN:-placeholder}
    depends_on:
      - fastmcp
      - mcp-http-caller
      - mcp-file-generator
      - mcp-text-generator
      - mcp-text-utils
      - mcp-rag-server
    networks:
      - poc-net
    # Not exposed to host — accessed only via the Next.js proxy

  nextjs-app:
    build: ./nextjs-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      KC_URL: http://keycloak:8080
      KC_REALM: poc-realm
      KC_CLIENT_ID: nextjs-client
      KC_REDIRECT_URI: http://localhost:3000/api/auth/callback
      OPENCODE_INTERNAL_URL: http://opencode:4321
      FASTMCP_INTERNAL_URL: http://fastmcp:8000
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-changeme}
    depends_on:
      keycloak:
        condition: service_healthy
      fastmcp:
        condition: service_started
    networks:
      - poc-net

networks:
  poc-net:
    driver: bridge
