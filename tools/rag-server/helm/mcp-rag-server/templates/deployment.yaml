apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-rag-server.fullname" . }}
  labels:
    {{- include "mcp-rag-server.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.persistence.enabled }}1{{ else }}{{ .Values.replicaCount }}{{ end }}
  selector:
    matchLabels:
      {{- include "mcp-rag-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-rag-server.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ .Values | toJson | sha256sum }}
    spec:
      containers:
        # ── Main RAG server ──────────────────────────────────────────────────
        - name: rag-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mcp
              containerPort: 8000
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.redis.internal.enabled }}
            - name: REDIS_URL
              value: "redis://localhost:6379/0"
            {{- else if .Values.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            - name: JOB_TTL_SECONDS
              value: {{ .Values.redis.ttlSeconds | quote }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: chroma-data
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        # ── Redis sidecar (job store) ────────────────────────────────────────
        {{- if .Values.redis.internal.enabled }}
        - name: redis
          image: redis:7-alpine
          args: ["--save", ""]   # disable persistence — jobs are transient
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
        {{- end }}

      {{- if .Values.persistence.enabled }}
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: {{ include "mcp-rag-server.fullname" . }}-chroma
      {{- end }}
