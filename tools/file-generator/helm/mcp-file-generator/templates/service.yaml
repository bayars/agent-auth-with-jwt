apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-file-generator.fullname" . }}
  labels:
    {{- include "mcp-file-generator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: mcp
      protocol: TCP
      name: mcp
  selector:
    {{- include "mcp-file-generator.selectorLabels" . | nindent 4 }}
