apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-a2a-bridge.fullname" . }}
  labels:
    {{- include "mcp-a2a-bridge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: mcp
      name: mcp
  selector:
    {{- include "mcp-a2a-bridge.selectorLabels" . | nindent 4 }}
