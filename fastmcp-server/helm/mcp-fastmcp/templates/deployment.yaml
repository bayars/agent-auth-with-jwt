apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-fastmcp.fullname" . }}
  labels:
    {{- include "mcp-fastmcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mcp-fastmcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp-fastmcp.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: fastmcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: mcp
              containerPort: 8000
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 8
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
