replicaCount: 2

image:
  repository: ghcr.io/your-org/mcp-fastmcp
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

env:
  KC_REALM_URL: ""        # REQUIRED: http://keycloak:8080/realms/poc-realm
  KC_ISSUER: ""           # REQUIRED: external-facing issuer, must match JWT iss claim
  FASTMCP_BASE_URL: ""    # REQUIRED: http://mcp-fastmcp:8000

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1
